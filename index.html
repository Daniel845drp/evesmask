<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carta</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="intro">
      <h1>Una carta para ti</h1>
      <p>Un pequeño detalle hecho con cariño</p>
    </header>
    <div class="container-letter">
      <div class="cover"></div>
      <span class="heart">💕</span>
      <p class="paper" id="mainMessage">
        Hola mi amochito; ¿Sabías que te ves muy hermosa? Cada día me encantas más 🥰.
        Tu sonrisa es la mas hermosa del mundo 🩷.
        Pará mí, eres la única chica del mumdo que me llama la atención, solo tu 🥰.    ㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤ
        
      </p>
      <div class="letter"></div>
    </div>
    <div class="options">
      <button id="open">Abrir</button>
      <button id="close">Cerrar</button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
