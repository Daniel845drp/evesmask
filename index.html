<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carta</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="intro">
      <h1>Una carta para ti</h1>
      <p>Un pequeño detalle hecho con cariño</p>
    </header>
    <div class="container-letter">
      <div class="cover"></div>
      <span class="heart">💕</span>
      <p class="paper" id="mainMessage">
        Hola mi amochito; No sabes cuanto te amo ❤️‍🩹.
        Eres todo para mi, no quisiera estar sin ti ni un momento.
        Se que a veces te hago sentir mal, pero nunca te dejare. Nunca.    ㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤ
        
      </p>
      <div class="letter"></div>
    </div>
    <div class="options">
      <button id="open">Abrir</button>
      <button id="close">Cerrar</button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
